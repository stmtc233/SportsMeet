name: release

# Publishing a GitHub release builds the packages for the three systems and
# attaches them to that release. The tag must be "v" + the version in
# mygo.config.ts. Run it by hand with a tag to rebuild an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已有 release 的标签,如 v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images and app signing need macOS, the NSIS installer needs
          # Windows; Linux packages build anywhere.
          - os: macos-latest
            platform: darwin/universal
            dir: darwin-universal
          - os: windows-latest
            platform: windows/amd64
            dir: windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            dir: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Read version
        run: |
          version=$(bun -e 'import c from "./mygo.config.ts"; console.log(c.version)')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::标签 $TAG 与 mygo.config.ts 的版本 $version 不一致"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # mygo build signs the update files with the key and uploads them with
      # the installers to the release of this version: installed apps read
      # update-<platform>.json from the latest release.
      - name: Build and upload
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bunx mygo build -platform ${{ matrix.platform }} -skip-notarize -upload

      # The portable package is the built app in an archive, run from wherever
      # it is unpacked. Linux has it already: the .tar.gz that mygo uploads.
      - name: Upload the portable package (macOS)
        if: runner.os == 'macOS'
        working-directory: build/${{ matrix.dir }}
        run: |
          zip="$RUNNER_TEMP/sportsmeet-$VERSION-${{ matrix.dir }}-portable.zip"
          ditto -c -k --sequesterRsrc --keepParent SportsMeet.app "$zip"
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload the portable package (Windows)
        if: runner.os == 'Windows'
        working-directory: build/${{ matrix.dir }}
        run: |
          zip="$RUNNER_TEMP/sportsmeet-$VERSION-${{ matrix.dir }}-portable.zip"
          # .mygo-files lists what the app is made of; it ships too, as
          # updates read it to remove files a new version no longer has.
          { tr -d '\r' < .mygo-files; echo .mygo-files; } | grep -v '^$' > "$RUNNER_TEMP/portable-files"
          7z a -tzip "$zip" "@$RUNNER_TEMP/portable-files"
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
